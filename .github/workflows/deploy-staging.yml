name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Staging
        run: npm run build:staging

      - name: Configure deploy key
        env:
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_DEPLOY_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Publish generated files
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/staging_deploy_key -o IdentitiesOnly=yes
        run: |
          git clone git@github.com:rinsawaragi/rin-sawaragi-hp-stg.git staging-repository
          rsync --archive --delete --exclude .git pages-dist/ staging-repository/
          cd staging-repository
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Staging is already up to date."
            exit 0
          fi
          git commit -m "Deploy staging from ${GITHUB_SHA}"
          git push origin main
